<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Floral Haven</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-color: #ff4d94; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f0f2f5; padding: 40px; }
        .cart-container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .btn-checkout { background: var(--primary-color); color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 20px; }
        .empty-msg { text-align: center; color: #999; padding: 40px; }
    </style>
</head>
<body>
    <div class="cart-container">
        <a href="customer.html" style="text-decoration: none; color: var(--primary-color); font-weight: 600;"><i class="fas fa-arrow-left"></i> Back to Shop</a>
        <h2 style="margin: 20px 0;">Your <span style="color: var(--primary-color);">Shopping Cart</span></h2>
        
        <div id="cartItems"></div>
        
        <div id="cartTotal" style="margin-top: 20px; text-align: right; font-weight: 600; font-size: 1.2em;"></div>
        <button id="checkoutBtn" class="btn-checkout" onclick="proceedToCheckout()" style="display: none;">Proceed to Checkout</button>
    </div>

    <script>
        function renderCart() {
            let cart = JSON.parse(localStorage.getItem('user_cart')) || [];
            const container = document.getElementById('cartItems');
            let total = 0;

            if (cart.length === 0) {
                container.innerHTML = '<div class="empty-msg"><i class="fas fa-shopping-basket fa-3x"></i><p><br>Your cart is empty!</p></div>';
                document.getElementById('checkoutBtn').style.display = 'none';
                document.getElementById('cartTotal').innerText = '';
                return;
            }

            container.innerHTML = '';
            cart.forEach((item, index) => {
                total += parseFloat(item.price);
                container.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <h4>${item.name}</h4>
                            <p style="color:var(--primary-color)">Rs. ${item.price}</p>
                        </div>
                        <button onclick="removeItem(${index})" style="background:none; border:none; color:red; cursor:pointer;"><i class="fas fa-trash"></i></button>
                    </div>`;
            });

            document.getElementById('cartTotal').innerText = 'Total: Rs. ' + total;
            document.getElementById('checkoutBtn').style.display = 'block';
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('user_cart'));
            cart.splice(index, 1);
            localStorage.setItem('user_cart', JSON.stringify(cart));
            renderCart();
        }

        function proceedToCheckout() {
            // Check if the customer is logged in
            let loggedUser = JSON.parse(localStorage.getItem('loggedInUser'));
            if (!loggedUser) {
                alert("Please Register/Login to complete your purchase!");
                window.location.href = 'login.html';
            } else {
                alert("Redirecting to payment...");
                // Link to payment page or existing modal here
            }
        }

        renderCart();
    </script>
</body>
</html>
