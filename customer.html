<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floral Haven | Customer Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-color: #ff4d94; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f0f2f5; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .main-container { width: 95%; max-width: 1200px; height: 90vh; background: white; border-radius: 30px; display: flex; overflow: hidden; }
        .sidebar { width: 280px; background: white; border-right: 1px solid #eee; padding: 30px 20px; }
        .nav-link { padding: 12px 15px; display: block; color: #555; text-decoration: none; margin-bottom: 10px; border-radius: 12px; cursor: pointer; }
        .nav-link:hover, .active-nav { background: var(--primary-color); color: white !important; }
        .content-area { flex: 1; padding: 40px; overflow-y: auto; background: #fafafa; }
        .flower-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .flower-card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .flower-card img { width: 100%; height: 160px; object-fit: cover; }
        .flower-info { padding: 15px; }
        .btn-buy { background: var(--primary-color); color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="sidebar">
            <h2 style="color:var(--primary-color)"><i class="fas fa-heart"></i> Bloom Shop</h2>
            <div class="nav-link active-nav">Browse Flowers</div>
            <div class="nav-link" onclick="window.location.href='login.html'" style="margin-top: auto; color: #999;"><i class="fas fa-sign-out-alt"></i> Logout</div>
        </div>
        <div class="content-area">
            <h1>Fresh <span style="color: var(--primary-color);">Arrivals</span></h1>
            <div id="customerDisplay" class="flower-grid" style="margin-top:20px;"></div>
        </div>
    </div>

    <script>
        let flowers = JSON.parse(localStorage.getItem('floral_inventory')) || [];
        function renderFlowers() {
            const container = document.getElementById('customerDisplay');
            container.innerHTML = '';
            flowers.forEach(f => {
                container.innerHTML += `<div class="flower-card">
                    <img src="${f.url}" onerror="this.src='https://via.placeholder.com/150'">
                    <div class="flower-info">
                        <h4>${f.name}</h4>
                        <p style="color:var(--primary-color); font-weight:600;">Rs. ${f.price}</p>
                        <button class="btn-buy" onclick="alert('Order Placed!')">Buy Now</button>
                    </div>
                </div>`;
            });
        }
        renderFlowers();
    </script>
</body>
</html>
