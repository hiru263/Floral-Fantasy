<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | Floral Haven</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-color: #ff4d94; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f0f2f5; padding: 40px; }
        .orders-container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .order-card { background: #fafafa; border: 1px solid #eee; border-radius: 15px; padding: 20px; margin-bottom: 15px; }
        .order-header { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
        .status-badge { background: #ffeaa7; color: #d35400; padding: 5px 12px; border-radius: 20px; font-size: 0.8em; font-weight: 600; }
        .empty-msg { text-align: center; color: #999; padding: 40px; }
        .back-btn { text-decoration: none; color: var(--primary-color); font-weight: 600; margin-bottom: 20px; display: inline-block; }
    </style>
</head>
<body>
    <div class="orders-container">
        <a href="customer.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Shop</a>
        <h2 style="margin-bottom: 25px;">My <span style="color: var(--primary-color);">Orders</span></h2>
        
        <div id="ordersList"></div>
    </div>

    <script>
        function loadOrders() {
            // Retrieve user orders from localStorage (shared with cart.html)
            let userOrders = JSON.parse(localStorage.getItem('user_orders')) || [];
            const container = document.getElementById('ordersList');

            if (userOrders.length === 0) {
                container.innerHTML = `
                    <div class="empty-msg">
                        <i class="fas fa-box-open fa-3x"></i>
                        <p><br>You haven't placed any orders yet.</p>
                    </div>`;
                return;
            }

            // Reverse to show the latest order first
            userOrders.reverse();

            container.innerHTML = '';
            userOrders.forEach(order => {
                container.innerHTML += `
                    <div class="order-card">
                        <div class="order-header">
                            <div>
                                <span style="color: #888; font-size: 0.9em;">Date: ${order.date}</span>
                            </div>
                            <span class="status-badge">${order.status}</span>
                        </div>
                        <div class="order-body">
                            <h4 style="margin-bottom: 5px;">Items: ${order.items}</h4>
                            <p style="color: var(--primary-color); font-weight: 600;">Total Paid: Rs. ${order.amount}</p>
                        </div>
                    </div>`;
            });
        }

        // Run the function when page loads
        loadOrders();
    </script>
</body>
</html>
