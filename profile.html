<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floral Haven | Web Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-red: #d90429; /* Deep Red */
            --light-red: #ef233c;
            --white: #ffffff;
            --light-bg: #f8f9fa;
            --text-dark: #2b2d42;
            --border: #edf2f4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background-color: var(--white);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
        }

        /* Side Navigation */
        .sidebar {
            width: 280px;
            background: var(--text-dark);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: var(--white);
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            color: var(--primary-red);
            text-align: center;
            margin-bottom: 50px;
        }

        .nav-links { list-style: none; }
        .nav-links li {
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            color: #ccc;
            display: flex;
            align-items: center;
            text-decoration: none;
        }
        
        /* Home link style */
        .nav-links a {
            text-decoration: none;
            color: inherit;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .nav-links li.active {
            background: var(--primary-red);
            color: var(--white);
        }

        .nav-links li:hover:not(.active) {
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
        }
        .nav-links i { margin-right: 15px; width: 20px; }

        /* Main Content Area */
        .main-content {
            flex: 1;
            padding: 60px;
            background: var(--light-bg);
        }

        .header-title {
            margin-bottom: 40px;
            border-bottom: 2px solid var(--primary-red);
            display: inline-block;
            padding-bottom: 10px;
        }
        .header-title h1 { font-size: 32px; font-weight: 600; color: var(--text-dark); }

        /* Dashboard Grid */
        .dashboard-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
        }

        /* Profile Quick View Card */
        .profile-card {
            background: var(--white);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            height: fit-content;
        }

        .profile-card img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid var(--primary-red);
            margin-bottom: 20px;
            object-fit: cover;
        }

        .profile-card h3 { font-size: 22px; color: var(--text-dark); }
        .profile-card span { color: var(--light-red); font-size: 14px; font-weight: 600; }

        /* Details Table Style */
        .details-wrapper {
            background: var(--white);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
        }
        .info-row:last-child { border-bottom: none; }

        .info-label { color: #666; font-size: 14px; font-weight: 600; }
        .info-value { color: var(--text-dark); font-weight: 400; text-align: right; }

        .btn-logout {
            margin-top: 30px;
            background: var(--primary-red);
            border: none;
            color: var(--white);
            padding: 12px 30px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
            width: 100%;
        }
        .btn-logout:hover {
            background: var(--text-dark);
        }

        @media (max-width: 1000px) {
            .dashboard-container { grid-template-columns: 1fr; }
            .sidebar { width: 80px; padding: 20px 10px; }
            .sidebar span, .logo span { display: none; }
        }
    </style>
</head>
<body>

    <!-- Sidebar Menu -->
    <div class="sidebar">
        <div>
            <div class="logo"><i class="fas fa-spa"></i> <span>Floral Haven</span></div>
            <ul class="nav-links">
                <!-- Home Link redirected to customer.html -->
                <li>
                    <a href="customer.html">
                        <i class="fas fa-home"></i> <span>Home</span>
                    </a>
                </li>
                <li class="active">
                    <a href="#">
                        <i class="fas fa-user"></i> <span>My Profile</span>
                    </a>
                </li>
            </ul>
        </div>
        <div style="padding: 20px; text-align: center;">
            <p style="font-size: 12px; color: #777;">© 2026</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header-title">
            <h1>User Profile</h1>
        </div>

        <div class="dashboard-container">
            <!-- Left Card -->
            <div class="profile-card">
                <img src="" id="profileImg" alt="User Image">
                <h3 id="userNameHeadline">Name</h3>
                <span>Premium Member</span>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>

            <!-- Right Details -->
            <div class="details-wrapper">
                <h4 style="margin-bottom: 25px; color: var(--primary-red); text-transform: uppercase; font-size: 14px;">Information Details</h4>
                
                <div class="info-row">
                    <div class="info-label">FULL NAME</div>
                    <div class="info-value" id="displayName">---</div>
                </div>

                <div class="info-row">
                    <div class="info-label">EMAIL ADDRESS</div>
                    <div class="info-value" id="displayEmail">---</div>
                </div>

                <div class="info-row">
                    <div class="info-label">MOBILE NUMBER</div>
                    <div class="info-value" id="displayPhone">---</div>
                </div>

                <div class="info-row">
                    <div class="info-label">HOME ADDRESS</div>
                    <div class="info-value" id="displayAddress">---</div>
                </div>

                <div class="info-row">
                    <div class="info-label">ACCOUNT STATUS</div>
                    <div class="info-value"><span style="color: #28a745; font-weight: 600;">Verified Account</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data Retrieval
        const name = localStorage.getItem('userName') || "Customer";
        const email = localStorage.getItem('userEmail') || "Not provided";
        const phone = localStorage.getItem('userPhone') || "Not provided";
        const address = localStorage.getItem('userAddress') || "Not provided";

        // UI Injection
        document.getElementById('userNameHeadline').innerText = name;
        document.getElementById('displayName').innerText = name;
        document.getElementById('displayEmail').innerText = email;
        document.getElementById('displayPhone').innerText = phone;
        document.getElementById('displayAddress').innerText = address;
        
        // Dynamic Profile Image
        document.getElementById('profileImg').src = `https://ui-avatars.com/api/?name=${name}&background=d90429&color=fff&size=130`;

        function logout() {
            window.location.href = 'index.html'; 
        }
    </script>
</body>
</html>
