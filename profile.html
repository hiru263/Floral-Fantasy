<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floral Haven | Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #ff4d94;
            --secondary-color: #ff85a2;
            --glass-bg: rgba(255, 255, 255, 0.2);
            --glass-border: rgba(255, 255, 255, 0.4);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), 
                        url('https://images.unsplash.com/photo-1526047932273-341f2a7631f9?auto=format&fit=crop&q=80');
            background-size: cover;
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        .profile-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            width: 400px;
            text-align: center;
            color: #fff;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }
        .profile-card h2 { margin-bottom: 20px; }
        .data-box { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 15px; margin-bottom: 10px; text-align: left; }
        .data-box p { font-size: 14px; }
        .btn-back {
            margin-top: 20px;
            padding: 10px 20px;
            width: 100%;
            border-radius: 15px;
            border: none;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <i class="fas fa-user-circle fa-5x" style="margin-bottom: 20px;"></i>
        <h2>User Profile</h2>
        <div class="data-box">
            <p><strong><i class="fas fa-user"></i> Name:</strong> <span id="displayName"></span></p>
        </div>
        <div class="data-box">
            <p><strong><i class="fas fa-envelope"></i> Email:</strong> <span id="displayEmail"></span></p>
        </div>
        <!-- Display Mobile Number -->
        <div class="data-box">
            <p><strong><i class="fas fa-phone"></i> Mobile:</strong> <span id="displayPhone"></span></p>
        </div>
        <!-- Display Home Address -->
        <div class="data-box">
            <p><strong><i class="fas fa-map-marker-alt"></i> Address:</strong> <span id="displayAddress"></span></p>
        </div>
        <button class="btn-back" onclick="window.location.href='index.html'">Logout</button>
    </div>

    <script>
        // Retrieve data from localStorage and display
        document.getElementById('displayName').innerText = localStorage.getItem('userName') || "N/A";
        document.getElementById('displayEmail').innerText = localStorage.getItem('userEmail') || "N/A";
        document.getElementById('displayPhone').innerText = localStorage.getItem('userPhone') || "N/A";
        document.getElementById('displayAddress').innerText = localStorage.getItem('userAddress') || "N/A";
    </script>
</body>
</html>
