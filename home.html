<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floral Haven | Professional System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #ff4d94;
            --admin-red: #d63031;
            --bg-light: #f8f9fa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-container {
            width: 95%;
            max-width: 1200px;
            height: 90vh;
            background: white;
            border-radius: 30px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .sidebar {
            width: 280px;
            background: white;
            border-right: 1px solid #eee;
            padding: 30px 20px;
        }

        .sidebar h2 {
            color: var(--primary-color);
            font-size: 20px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-link {
            padding: 12px 15px;
            display: block;
            color: #555;
            text-decoration: none;
            margin-bottom: 10px;
            border-radius: 12px;
            transition: 0.3s;
            cursor: pointer;
        }

        .nav-link:hover, .active-nav {
            background: var(--admin-red);
            color: white !important;
        }

        .content-area {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            background: #fafafa;
        }

        .section { display: none; }
        .active-section { display: block; animation: fadeIn 0.5s; }

        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        input:focus { border-color: var(--primary-color); }

        .btn-add {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: 0.3s;
        }

        .btn-add:hover { background: #e63980; }

        .flower-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .flower-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 1px solid #f0f0f0;
        }

        .flower-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .flower-info { padding: 15px; }
        .flower-info h4 { color: #333; margin-bottom: 5px; }
        .flower-info .price { color: var(--admin-red); font-weight: 600; font-size: 1.1rem; }
        .flower-info .stock { color: #777; font-size: 0.9rem; margin-bottom: 10px; }

        .delete-btn {
            color: #ff4d4d;
            cursor: pointer;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 600;
            border: none;
            background: none;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="sidebar">
            <h2><i class="fas fa-user-cog"></i> Shop Admin</h2>
            <div class="nav-link" onclick="showSection('sales-report')"><i class="fas fa-chart-pie"></i> Sales Report</div>
            <div class="nav-link active-nav" onclick="showSection('inventory')"><i class="fas fa-seedling"></i> Inventory (Add Flowers)</div>
            <div class="nav-link" onclick="showSection('customers')"><i class="fas fa-users"></i> Customers</div>
            <div class="nav-link" onclick="location.reload()" style="margin-top: 50px; color: #999;"><i class="fas fa-sign-out-alt"></i> Logout</div>
        </div>

        <div class="content-area">
            
            <!-- Inventory Section -->
            <div id="inventory" class="section active-section">
                <h1>Flower <span style="color: var(--primary-color);">Inventory</span></h1>
                
                <div style="background: white; padding: 25px; border-radius: 20px; margin-top: 20px; border: 1px solid #eee;">
                    <h3 style="margin-bottom: 15px;">Add New Flower to Store</h3>
                    
                    <div class="form-group">
                        <label>Flower Name</label>
                        <input type="text" id="flowerName" placeholder="e.g. Red Roses">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Price (Rs.)</label>
                            <input type="number" id="flowerPrice" placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label>Quantity (Stock)</label>
                            <input type="number" id="flowerQty" placeholder="0">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Image URL</label>
                        <input type="text" id="imageUrl" placeholder="Paste image link here">
                    </div>
                    
                    <button class="btn-add" onclick="addFlower()">Add to Display</button>
                </div>

                <h3 style="margin-top: 30px; color: #444;">Current Stock / Display</h3>
                <div id="displayArea" class="flower-grid">
                    <!-- Data will be rendered here -->
                </div>
            </div>

            <!-- Other sections (Placeholders) -->
            <div id="sales-report" class="section"><h1>Sales Report</h1><p>Summary of transactions.</p></div>
            <div id="customers" class="section"><h1>Customers</h1><p>Registered customer list.</p></div>

        </div>
    </div>

    <script>
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active-section'));
            document.getElementById(sectionId).classList.add('active-section');
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active-nav');
                if(link.innerText.toLowerCase().includes(sectionId.split('-')[0])) link.classList.add('active-nav');
            });
        }

        // Data Management
        let flowers = JSON.parse(localStorage.getItem('floral_inventory')) || [];

        function addFlower() {
            const name = document.getElementById('flowerName').value;
            const price = document.getElementById('flowerPrice').value;
            const qty = document.getElementById('flowerQty').value;
            const url = document.getElementById('imageUrl').value;

            if(name && price && qty && url) {
                const newFlower = {
                    name: name,
                    price: price,
                    qty: qty,
                    url: url
                };
                
                flowers.push(newFlower);
                localStorage.setItem('floral_inventory', JSON.stringify(flowers));
                
                // Clear inputs
                document.getElementById('flowerName').value = '';
                document.getElementById('flowerPrice').value = '';
                document.getElementById('flowerQty').value = '';
                document.getElementById('imageUrl').value = '';
                
                renderFlowers();
            } else {
                alert("Please fill all details (Name, Price, Quantity, and Image URL)");
            }
        }

        function renderFlowers() {
            const container = document.getElementById('displayArea');
            container.innerHTML = '';
            
            flowers.forEach((f, index) => {
                container.innerHTML += `
                    <div class="flower-card">
                        <img src="${f.url}" onerror="this.src='https://via.placeholder.com/150?text=Image+Not+Found'">
                        <div class="flower-info">
                            <h4>${f.name}</h4>
                            <p class="price">Rs. ${parseFloat(f.price).toLocaleString()}</p>
                            <p class="stock">Available: ${f.qty} units</p>
                            <button class="delete-btn" onclick="deleteFlower(${index})">Remove Item</button>
                        </div>
                    </div>
                `;
            });
        }

        function deleteFlower(index) {
            if(confirm("Are you sure you want to remove this item?")) {
                flowers.splice(index, 1);
                localStorage.setItem('floral_inventory', JSON.stringify(flowers));
                renderFlowers();
            }
        }

        // Initial Load
        renderFlowers();
    </script>
</body>
</html>
