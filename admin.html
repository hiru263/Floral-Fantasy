<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floral Haven | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-color: #ff4d94; --admin-red: #d63031; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f0f2f5; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .main-container { width: 95%; max-width: 1200px; height: 90vh; background: white; border-radius: 30px; display: flex; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .sidebar { width: 280px; background: white; border-right: 1px solid #eee; padding: 30px 20px; }
        .sidebar h2 { color: var(--primary-color); font-size: 20px; margin-bottom: 40px; display: flex; align-items: center; gap: 10px; }
        .nav-link { padding: 12px 15px; display: block; color: #555; text-decoration: none; margin-bottom: 10px; border-radius: 12px; cursor: pointer; }
        .nav-link:hover, .active-nav { background: var(--admin-red); color: white !important; }
        .content-area { flex: 1; padding: 40px; overflow-y: auto; background: #fafafa; }
        .section { display: none; }
        .active-section { display: block; }
        .form-group { margin-bottom: 15px; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; }
        .btn-add { background: var(--primary-color); color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 600; }
        .flower-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
        .flower-card { background: white; border-radius: 15px; overflow: hidden; border: 1px solid #f0f0f0; }
        .flower-card img { width: 100%; height: 160px; object-fit: cover; }
        .flower-info { padding: 15px; }
        .delete-btn { color: #ff4d4d; cursor: pointer; border: none; background: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="sidebar">
            <h2><i class="fas fa-user-cog"></i> Shop Admin</h2>
            <div class="nav-link active-nav" onclick="showSection('inventory')"><i class="fas fa-seedling"></i> Inventory</div>
            <div class="nav-link" onclick="showSection('sales-report')"><i class="fas fa-chart-pie"></i> Sales Report</div>
            <div class="nav-link" onclick="window.location.href='login.html'" style="margin-top: 50px; color: #999;"><i class="fas fa-sign-out-alt"></i> Logout</div>
        </div>
        <div class="content-area">
            <div id="inventory" class="section active-section">
                <h1>Flower <span style="color: var(--primary-color);">Inventory</span></h1>
                <div style="background: white; padding: 25px; border-radius: 20px; border: 1px solid #eee;">
                    <input type="text" id="flowerName" placeholder="Flower Name">
                    <input type="number" id="flowerPrice" placeholder="Price (Rs.)">
                    <input type="number" id="flowerQty" placeholder="Quantity">
                    <input type="text" id="imageUrl" placeholder="Image URL">
                    <button class="btn-add" onclick="addFlower()">Add to Display</button>
                </div>
                <div id="displayArea" class="flower-grid"></div>
            </div>
            <div id="sales-report" class="section"><h1>Sales Report</h1></div>
        </div>
    </div>

    <script>
        let flowers = JSON.parse(localStorage.getItem('floral_inventory')) || [];
        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active-section'));
            document.getElementById(id).classList.add('active-section');
        }
        function addFlower() {
            const name = document.getElementById('flowerName').value;
            const price = document.getElementById('flowerPrice').value;
            const qty = document.getElementById('flowerQty').value;
            const url = document.getElementById('imageUrl').value;
            if(name && price && url) {
                flowers.push({name, price, qty, url});
                localStorage.setItem('floral_inventory', JSON.stringify(flowers));
                renderFlowers();
            }
        }
        function renderFlowers() {
            const container = document.getElementById('displayArea');
            container.innerHTML = '';
            flowers.forEach((f, i) => {
                container.innerHTML += `<div class="flower-card">
                    <img src="${f.url}" onerror="this.src='https://via.placeholder.com/150'">
                    <div class="flower-info">
                        <h4>${f.name}</h4>
                        <p>Rs. ${f.price}</p>
                        <button class="delete-btn" onclick="deleteFlower(${i})">Remove</button>
                    </div>
                </div>`;
            });
        }
        function deleteFlower(i) {
            flowers.splice(i, 1);
            localStorage.setItem('floral_inventory', JSON.stringify(flowers));
            renderFlowers();
        }
        renderFlowers();
    </script>
</body>
</html>
